<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block meta_description %}SpaceLens AI — AI-powered satellite image intelligence platform.{% endblock %}" />
  <title>{% block title %}SpaceLens AI{% endblock %} | SpaceLens AI</title>

  {% load static %}

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

  <!-- SpaceLens Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/spacelens.css' %}" />

  {% block extra_css %}{% endblock %}
</head>
<body>

<!-- Star-field background layer -->
<div class="stars-bg" aria-hidden="true"></div>

<!-- ── Navbar ─────────────────────────────────────────────── -->
{% include "partials/_navbar.html" %}

<!-- ── Flash messages ────────────────────────────────────── -->
{% include "partials/_messages.html" %}

<!-- ── Page content ──────────────────────────────────────── -->
{% block content %}{% endblock %}

<!-- ── Footer (only on public pages; dashboard overrides) ── -->
{% block footer %}
  {% include "partials/_footer.html" %}
{% endblock %}

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js (used on prediction result page) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<!-- SpaceLens JS -->
<script src="{% static 'js/spacelens.js' %}"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
