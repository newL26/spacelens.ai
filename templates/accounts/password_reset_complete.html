{% extends "base.html" %}
{% block title %}Password Reset Complete{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="sl-auth-wrapper">
  <div class="sl-auth-card animate-fade-up text-center">

    <div class="auth-logo">
      <div class="logo-mark" style="background:linear-gradient(135deg,var(--sl-success),#16a34a);">
        <i class="bi bi-check-lg"></i>
      </div>
      <h1>Password Reset!</h1>
    </div>

    <p style="color:var(--sl-text-muted);font-size:0.92rem;line-height:1.75;">
      Your password has been set. You can now sign in with your new password.
    </p>

    <a href="{% url 'accounts:login' %}" class="btn btn-sl-primary w-100 mt-3">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In Now
    </a>

  </div>
</div>
{% endblock %}
