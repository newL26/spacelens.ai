{% if messages %}
<div class="container-xl mt-3" id="messagesContainer">
  {% for message in messages %}
  <div class="sl-alert sl-alert-{{ message.tags }} alert-dismissible mb-2"
       data-auto-dismiss="5000" role="alert">
    <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill
                 {% elif message.tags == 'danger' or message.tags == 'error' %}bi-x-circle-fill
                 {% elif message.tags == 'warning' %}bi-exclamation-triangle-fill
                 {% else %}bi-info-circle-fill{% endif %}
       me-1 flex-shrink-0"></i>
    <span>{{ message }}</span>
    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
