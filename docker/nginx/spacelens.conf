# ╔══════════════════════════════════════════════════════════════╗
# ║  SpaceLens AI — Nginx site configuration                    ║
# ╚══════════════════════════════════════════════════════════════╝

upstream spacelens_app {
    server web:8000;
    keepalive 32;
}

# ── HTTP → redirect to HTTPS (comment out if not using SSL) ──────────────────
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

# ── Main server block ─────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  _;

    # ── Static files (served directly by Nginx — fastest path) ───────────────
    location /static/ {
        alias       /app/staticfiles/;
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
        gzip_static on;
    }

    # ── Media files (user-uploaded satellite images) ──────────────────────────
    location /media/ {
        alias       /app/media/;
        expires     7d;
        add_header  Cache-Control "public";
        access_log  off;

        # Prevent execution of scripts in media/
        location ~* \.(php|py|pl|cgi)$ {
            deny all;
        }
    }

    # ── Health check (bypasses Django for fast LB probes) ─────────────────────
    location = /health/ {
        access_log off;
        proxy_pass         http://spacelens_app;
        proxy_set_header   Host $host;
    }

    # ── Application proxy ─────────────────────────────────────────────────────
    location / {
        proxy_pass          http://spacelens_app;
        proxy_http_version  1.1;
        proxy_set_header    Connection         "";
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;

        # Match Gunicorn timeout
        proxy_connect_timeout   10s;
        proxy_send_timeout      120s;
        proxy_read_timeout      120s;

        # Buffer settings
        proxy_buffering         on;
        proxy_buffer_size       8k;
        proxy_buffers           16 8k;
        proxy_busy_buffers_size 64k;
    }
}

